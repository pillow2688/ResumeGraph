[project]
name = "resumegraph-backend"
version = "0.1.0"
description = "Backend foundation for ResumeGraph"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2.0",
    "arq>=0.28,<0.29",
    "asyncpg>=0.29,<1.0",
    "fastapi>=0.115,<1.0",
    "langgraph>=1.2,<1.3",
    "openai>=2.0,<3.0",
    "pgvector>=0.4,<1.0",
    "pwdlib[argon2]>=0.3,<1.0",
    "pydantic-settings>=2.5,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "redis>=5.0,<7.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.0,<3.0",
    "pytest>=8.3,<10.0",
    "ruff>=0.9,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
